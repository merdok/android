<!doctype html><html lang="__API_LANG__"><head><base href="/"><meta charset="utf-8">
<script>/* ?theme=light|dark override, else the browser preference (prefers-color-scheme) */
(function(){var m=location.search.match(/[?&]theme=(dark|light)\b/);if(m)document.documentElement.setAttribute("data-theme",m[1])})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Assistant · REST API</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="info.css">
<style>
 /* The shared stylesheet (info.css) carries the tokens, the header lock-up, buttons, pills and the
    shielded-action legend; these rules lay out the explorer itself. The response <pre> keeps its
    terminal look in both themes, like the logs panel elsewhere. */
 .wrap{max-width:900px;margin:0 auto;padding:20px}
 .hdr{margin-bottom:6px;flex-wrap:wrap}   /* no header script here: the back link wraps under the title */
 .wrap{container:apiwrap/inline-size}
 @container apiwrap (width < 420px){.hdr .brand{display:none}}
 a{color:var(--accent2)}
 h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--icon);margin:22px 0 8px;border-bottom:1px solid var(--card-border);padding-bottom:4px}
 .ep{background:var(--card);border:1px solid var(--card-border);border-radius:10px;margin:0 0 10px;overflow:hidden}
 summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
 summary::-webkit-details-marker{display:none}
 .path{font-family:ui-monospace,monospace;font-size:.92rem;color:var(--text)} .sum{color:var(--ok-dim);font-size:.85rem;margin-left:auto;text-align:right}
 @media(max-width:600px){summary{flex-wrap:wrap}.path{min-width:0;overflow-wrap:anywhere}.sum{flex-basis:100%;margin-left:0;text-align:left;overflow-wrap:anywhere}}
 .body{padding:0 14px 14px;border-top:1px solid var(--card-border)}
 label{display:block;font-size:.78rem;color:var(--accent);margin:10px 0 4px}
 input,select,textarea{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);box-sizing:border-box;width:100%}
 textarea{min-height:54px;font-family:ui-monospace,monospace}
 button{width:auto;margin-top:12px}
 pre{background:var(--chart-bg);border:1px solid var(--card-border);border-radius:7px;padding:10px;margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:.82rem;color:var(--api-response-fg);max-height:300px;overflow:auto}
 .st{font-size:.78rem;margin-top:8px}
 .desc{color:var(--ok-dim);font-size:.82rem;margin:2px 0 0}
 [data-hardened-approval]::after{margin-left:.42rem}
</style></head><body><div class="wrap">
<div class="hdr"><h1>__API_BRAND__ <small>· REST API</small></h1><a id="api-back" href="__API_BACK_HREF__"></a></div>
<p class="desc"><span id="api-intro-live"></span> <span id="api-intro-import"></span> <span id="api-intro-network"></span></p>
<span id="hardened-approval-description" class="sr-only"></span>
<span id="hardened-approval-conditional-description" class="sr-only"></span>
<div id="root"></div>
<p id="api-approval-key" class="hardened-approval-key"></p>
<script id="ha-i18n" type="application/json">__API_I18N_PAYLOAD__</script>
<script src="assets/i18n.js"></script>
<script src="assets/transport.js"></script>
<script src="assets/api.js"></script>
</div></body></html>
