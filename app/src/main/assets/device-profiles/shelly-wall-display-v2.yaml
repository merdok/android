schema: 2
id: shelly-wall-display-v2
version: 2.3.0
display_name: Shelly Wall Display (modern)
soc_class: "Model-dependent (known: RK3326-S / RK3566)"
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/shelly-wall-display
  license: Apache-2.0
  maturity: experimental
  limitations:
    - SoC and proximity or motion details vary by model and still need live-hardware confirmation.
    - On-board relays are not exposed. The one model examined on hardware routes them through a world-writable sysfs class, but ha-paneld drives relays through its privileged route, and no relay path is established for the other models this profile covers.
    - The X2i has its own profile. Its firmware-level findings are projected onto the remaining models because they share its Stargate firmware line. They are the screen-timeout screen-off route, Recents being absent (the firmware ignores the Recents key) and Stargate's Home registration. Its unit-level facts (SoC, microphone, proximity technology, density and local wake) are not projected.
    - Screen-off lets Android's own screen timeout turn the display fully off where that is proven on a model; where Android does not go to sleep, or Panel Assistant has not granted WRITE_SECURE_SETTINGS, screen-off falls back to dimming. How a dark panel wakes locally is not declared, because touch wake is unmeasured on these models.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - screen.screen-timeout
    - sensor.android
match:
  # Match values are derived from the modern Shelly Wall Display firmware identity.
  priority: 500
  fallback: false
  any:
    - priority: 970
      all:
        - field: model
          op: equals
          values:
            - blake
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: device
          op: equals
          values:
            - blake
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: model
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
    - priority: 970
      all:
        - field: device
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
platform:
  # The application UID is sandboxed; privileged operations use the helper route.
  su_form: none
  app_can_su: false
  # Projected from the X2i: the Stargate firmware ignores the Recents key.
  has_recents: false
  launcher:
    # Shelly's Stargate registers as Home but offers no route to Android Settings.
    # The Launcher button skips it and opens the admin launcher, which lists it as an app.
    vendor_home_packages:
      - cloud.shelly.stargate
hardware:
  led:
    mechanism: none
    transfer: identity
  # Projected from the X2i. Falls back to dimming when Android does not go noninteractive or the
  # secure-settings grant is missing.
  screen_off: screen-timeout
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Shelly
  model: Wall Display
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
