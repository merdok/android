schema: 2
id: shelly-wall-display-v2
version: 2.6.0
display_name: Shelly Wall Display (modern)
soc_class: "Model-dependent (known: RK3326-S / RK3566)"
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/shelly-wall-display
  license: Apache-2.0
  maturity: experimental
  limitations:
    - SoC and proximity or motion details vary by model and still need live-hardware confirmation.
    - On-board relays are not exposed. The one model examined on hardware routes them through a world-writable sysfs class, but ha-paneld drives relays through its privileged route, and no relay path is established for the other models this profile covers.
    - The X2i has its own profile. Its firmware-level findings are projected onto the remaining models because they share its Stargate firmware line. They are the screen-off routes, Recents being absent (the firmware ignores the Recents key) and Stargate's Home registration. Its unit-level facts (SoC, microphone, proximity technology, density and local wake) are not projected.
    - Stargate's local service on port 8021, which Home Assistant's Shelly integration uses, is projected from the X2i on the same firmware line, where it listens only once Stargate's main screen has been created. The app checks the port at runtime and creates that screen under a cover only when nothing listens, so a model that already serves it is left alone.
    - Screen-off asks Shelly's launcher to switch the backlight off over its local RPC, as measured on the X2i, and counts it only once the backlight reads dark; a touch then wakes it without reaching the dashboard. Where the launcher does not answer, Android's own screen timeout turns the display off, or screen-off dims when Android does not sleep or WRITE_SECURE_SETTINGS is missing. Touch wake from Android's sleep is unmeasured on these models, so it is not declared.
    - While Shelly's launcher runs, the app switches its automatic brightness off through the same local RPC, so the brightness Home Assistant sets is the one shown; it does so again whenever it finds the launcher running.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - screen.vendor-rpc
    - sensor.android
match:
  # Match values are derived from the modern Shelly Wall Display firmware identity.
  priority: 500
  fallback: false
  any:
    - priority: 970
      all:
        - field: model
          op: equals
          values:
            - blake
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: device
          op: equals
          values:
            - blake
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: model
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
    - priority: 970
      all:
        - field: device
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
platform:
  # The application UID is sandboxed; privileged operations use the helper route.
  su_form: none
  app_can_su: false
  # Projected from the X2i: the Stargate firmware ignores the Recents key.
  has_recents: false
  # Stargate replaces Android's navigation bar on every Shelly Wall Display.
  has_native_navbar: false
  launcher:
    # Shelly's Stargate registers as Home but offers no route to Android Settings.
    # The Launcher button skips it and opens the admin launcher, which lists it as an app.
    vendor_home_packages:
      - cloud.shelly.stargate
    # Projected from the X2i: the same Stargate serves Home Assistant's Shelly RPC on TCP 8021 only
    # once its MainActivity exists. The app checks the port first, so a model that already listens is left alone.
    vendor_service:
      activity: cloud.shelly.stargate/.activities.MainActivity
      port: 8021
hardware:
  led:
    mechanism: none
    transfer: identity
  # Projected from the X2i: Stargate's Ui.Screen.Set, confirmed on the backlight node. Falls back to
  # the screen timeout, then to dimming when Android does not sleep or the secure-settings grant is missing.
  screen_off: vendor-rpc
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Shelly
  model: Wall Display
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
