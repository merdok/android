schema: 2
id: meta-portal
version: 1.0.0
display_name: Meta Portal
soc_class: "Model-dependent"
metadata:
  author: ha-paneld maintainers
  license: Apache-2.0
  maturity: experimental
  tested_firmware: []
  limitations:
    - Tested only on the Portal 10" (2nd gen), which has its own profile. Other Portal models may differ; the 1st gen (Android 9) has different sensors.
    - The Portal TV has no screen and is not supported.
    - Camera and microphone stay off until they are checked on your model.
    - Network ADB does not survive a restart.
    - The ADB switch (Settings › Debug, behind the Meta account PIN) shows no on or off state; tap it until the panel appears on your computer.
    - Keep the Meta account signed in. Removing it hides the ADB switch and stops Meta's on-screen factory reset from working.
    - Meta's volume slider does not change media volume, which is what spoken replies use.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - screen.screen-timeout
match:
  # Portals with a screen, matched on Meta's device codename, never the model string: the
  # model reads Portal, Portal+ or Portal Mini and the 1st gen also reports Portal.
  # omni: the Android 10 (2nd gen) image, shared by the 10" (2nd gen) and reportedly the Mini.
  # aloha: the Android 9 (1st gen) image of the Portal and Portal+.
  # ripley (Portal TV) has no screen and is deliberately left out.
  # The exact 10" (2nd gen) branch outranks this one.
  priority: 500
  fallback: false
  any:
    - priority: 900
      all:
        - field: device
          op: equals
          values:
            - omni
            - aloha
platform:
  su_form: none
  app_can_su: false
  has_recents: true
  has_native_navbar: false
  launcher:
    # Meta's launcher registers as Home but is a clock face, not an app drawer.
    # The Launcher button skips it and opens the admin launcher.
    vendor_home_packages:
      - com.facebook.alohaapps.launcher
hardware:
  led:
    mechanism: none
    transfer: identity
  screen_off: screen-timeout
  has_button_backlight: false
sensors:
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Meta
  model: Portal
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
